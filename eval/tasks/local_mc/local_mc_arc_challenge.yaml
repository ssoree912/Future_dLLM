# Generated by generate_local_mc.py — lm-eval arc/arc_easy.yaml + arc_challenge.yaml,
# with the Hub dataset swapped for local parquet.
task: local_mc_arc_challenge
dataset_path: parquet
dataset_kwargs:
  data_files:
    validation: DATA_DIR/eval/arc_challenge/validation.parquet
    test: DATA_DIR/eval/arc_challenge/test.parquet
output_type: multiple_choice
validation_split: validation
test_split: test
doc_to_text: "Question: {{question}}\nAnswer:"
doc_to_target: "{{choices.label.index(answerKey)}}"
doc_to_choice: "{{choices.text}}"
should_decontaminate: true
doc_to_decontamination_query: "Question: {{question}}\nAnswer:"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
