# Generated by generate_local_mc.py — lm-eval piqa/piqa.yaml, with the Hub dataset
# swapped for local parquet. baber/piqa is a parquet mirror of ybisk/piqa, which is what
# scripts/download_data.py writes, so the rows are the same.
task: local_mc_piqa
dataset_path: parquet
dataset_kwargs:
  data_files:
    validation: DATA_DIR/eval/piqa/validation.parquet
output_type: multiple_choice
validation_split: validation
test_split: null
doc_to_text: "Question: {{goal}}\nAnswer:"
doc_to_target: label
doc_to_choice: "{{[sol1, sol2]}}"
should_decontaminate: true
doc_to_decontamination_query: goal
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
