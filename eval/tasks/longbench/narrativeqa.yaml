# Generated from LongBench's own config/dataset2prompt.json and
# config/dataset2maxlen.json, against the official zai-org/LongBench data.
tag:
  - longbench_single_tasks
  - longbench_tasks
task: longbench_narrativeqa
dataset_path: json
dataset_kwargs:
  data_files:
    test: LONGBENCH_DATA_DIR/narrativeqa.jsonl
test_split: test
doc_to_text: "You are given a story, which can be either a novel or a movie script, and a question. Answer the question asconcisely as you can, using a single phrase if possible. Do not provide any explanation.\n\nStory: {{context}}\n\nNow, answer the question based on the story asconcisely as you can, using a single phrase if possible. Do not provide any explanation.\n\nQuestion: {{input}}\n\nAnswer:"
doc_to_target: '{{answers}}'
target_delimiter: ""
process_results: !function metrics.get_qa_f1_with_score
generation_kwargs:
  max_gen_toks: 128
  do_sample: false
  until: []
metric_list:
  - metric: "score"
    aggregation: mean
    higher_is_better: True
  - metric: "qa_f1_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 6.0
