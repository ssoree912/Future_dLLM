# Generated from LongBench's own config/dataset2prompt.json and
# config/dataset2maxlen.json, against the official zai-org/LongBench data.
tag:
  - longbench_summarization_tasks
  - longbench_tasks
task: longbench_qmsum
dataset_path: json
dataset_kwargs:
  data_files:
    test: LONGBENCH_DATA_DIR/qmsum.jsonl
test_split: test
doc_to_text: "You are given a meeting transcript and a query containing a question or instruction. Answer the query in one or more sentences.\n\nTranscript:\n{{context}}\n\nNow, answer the query based on the above meeting transcript in one or more sentences.\n\nQuery: {{input}}\nAnswer:"
doc_to_target: '{{answers}}'
target_delimiter: ""
process_results: !function metrics.get_rouge_with_score
generation_kwargs:
  max_gen_toks: 512
  do_sample: false
  until: []
metric_list:
  - metric: "score"
    aggregation: mean
    higher_is_better: True
  - metric: "rouge_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 6.0
