# Generated from LongBench's own config/dataset2prompt.json and
# config/dataset2maxlen.json, against the official zai-org/LongBench data.
tag:
  - longbench_fewshot_tasks
  - longbench_tasks
task: longbench_samsum
dataset_path: json
dataset_kwargs:
  data_files:
    test: LONGBENCH_DATA_DIR/samsum.jsonl
test_split: test
doc_to_text: "Summarize the dialogue into a few short sentences. The following are some examples.\n\n{{context}}\n\n{{input}}"
doc_to_target: '{{answers}}'
target_delimiter: ""
process_results: !function metrics.get_rouge_with_score
generation_kwargs:
  max_gen_toks: 128
  do_sample: false
  until: []
metric_list:
  - metric: "score"
    aggregation: mean
    higher_is_better: True
  - metric: "rouge_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 6.0
