# Generated from LongBench's own config/dataset2prompt.json and
# config/dataset2maxlen.json, against the official zai-org/LongBench data.
tag:
  - longbench_multi_tasks
  - longbench_tasks
task: longbench_musique
dataset_path: json
dataset_kwargs:
  data_files:
    test: LONGBENCH_DATA_DIR/musique.jsonl
test_split: test
doc_to_text: "Answer the question based on the given passages. Only give me the answer and do not output any other words.\n\nThe following are given passages.\n{{context}}\n\nAnswer the question based on the given passages. Only give me the answer and do not output any other words.\n\nQuestion: {{input}}\nAnswer:"
doc_to_target: '{{answers}}'
target_delimiter: ""
process_results: !function metrics.get_qa_f1_with_score
generation_kwargs:
  max_gen_toks: 32
  do_sample: false
  until: []
metric_list:
  - metric: "score"
    aggregation: mean
    higher_is_better: True
  - metric: "qa_f1_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 6.0
